<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Peak Gaming Zone</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Swiper CSS (Slider) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(15, 23, 42, 0.90), rgba(15, 23, 42, 0.95)), 
                  url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=1200&q=80') center/cover fixed no-repeat;
      color: #ffffff;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .swiper-pagination-bullet-active {
      background: #eab308 !important;
    }
    .swiper-pagination-bullet {
      background: #94a3b8;
    }
  </style>
</head>
<body class="pb-24 min-h-screen relative">

  <!-- Header Section -->
  <header class="flex justify-between items-center p-4 bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">⛰️</span>
      <h1 class="text-lg font-extrabold bg-gradient-to-r from-slate-200 via-amber-300 to-amber-400 bg-clip-text text-transparent uppercase tracking-wider">
        Silver Peak Gaming Zone
      </h1>
    </div>
    <div class="flex items-center space-x-2">
      <a href="https://t.me/your_telegram_username" target="_blank" rel="noopener noreferrer" class="p-2 bg-sky-500/20 text-sky-400 border border-sky-500/40 rounded-lg hover:bg-sky-500/30 transition flex items-center gap-1 text-xs font-bold">
        <i class="fa-brands fa-telegram text-base"></i>
        <span class="hidden sm:inline">Telegram</span>
      </a>
      <button onclick="openLiveChat()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
        Login
      </button>
      <button onclick="openLiveChat()" class="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 text-xs font-bold rounded-lg hover:opacity-90 shadow-lg shadow-amber-500/20 transition">
        Register
      </button>
    </div>
  </header>

  <!-- Category Nav Tabs -->
  <div class="grid grid-cols-5 gap-2 p-3 bg-slate-900/80 backdrop-blur border-b border-slate-800 text-center text-xs">
    <button onclick="filterCategory('all')" class="p-2 bg-slate-800/80 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center transition">
      <i class="fa-solid fa-fire text-orange-500 text-base mb-1"></i>Hot
    </button>
    <button onclick="filterCategory('all')" class="p-2 bg-slate-800/80 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center transition">
      <i class="fa-solid fa-bolt text-yellow-400 text-base mb-1"></i>Instant
    </button>
    <button onclick="filterCategory('slot')" class="p-2 bg-slate-800/80 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center transition">
      <i class="fa-solid fa-gamepad text-blue-400 text-base mb-1"></i>Slots
    </button>
    <button onclick="filterCategory('casino')" class="p-2 bg-slate-800/80 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center transition">
      <i class="fa-solid fa-dice text-red-500 text-base mb-1"></i>Casino
    </button>
    <button onclick="filterCategory('cards')" class="p-2 bg-slate-800/80 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center transition">
      <i class="fa-solid fa-spade text-purple-400 text-base mb-1"></i>Cards
    </button>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Customized Main Offer Banner -->
    <section class="swiper offerSwiper rounded-2xl overflow-hidden border border-amber-500/30 shadow-2xl relative">
      <div class="swiper-wrapper">
        <div class="swiper-slide bg-gradient-to-r from-red-700 via-orange-600 to-amber-600 p-6 text-white flex flex-col justify-center min-h-[160px]">
          <span class="bg-black/50 text-yellow-300 font-extrabold px-3 py-1 rounded-md text-xs w-max border border-yellow-400/40 uppercase tracking-widest mb-2 shadow-md">
            🔥 WELCOME BONUS
          </span>
          <h2 class="text-xl sm:text-2xl font-black tracking-tight text-white drop-shadow leading-tight">
            Welcome to legitimate family <br>
            <span class="text-yellow-300">Always open</span>
          </h2>
          <p class="text-xs sm:text-sm font-semibold text-amber-100 mt-2">
            Amazing bonus on your every deposit — Play and win!
          </p>
          <div class="flex gap-2 mt-4">
            <button onclick="openLiveChat()" class="bg-slate-950 text-yellow-400 text-xs font-bold px-4 py-2 rounded-lg border border-yellow-500/40 hover:bg-slate-900 transition">
              Get Bonus
            </button>
            <a href="https://t.me/your_telegram_username" target="_blank" rel="noopener noreferrer" class="bg-sky-500 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-sky-600 transition flex items-center gap-1">
              <i class="fa-brands fa-telegram"></i> Telegram
            </a>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </section>

    <!-- Games Grid Section -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold border-l-4 border-yellow-500 pl-3">
          🎮 Available Games
        </h2>
        <span class="text-xs text-slate-400">Click card to play</span>
      </div>
      <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <!-- Games render dynamically -->
      </div>
    </section>

    <!-- Live Chat Section -->
    <section class="bg-slate-900/90 backdrop-blur p-4 rounded-xl border border-slate-800">
      <h3 class="text-md font-bold mb-3 flex items-center gap-2 text-yellow-400">
        <i class="fa-solid fa-comments"></i> Community Live Chat
      </h3>
      <div id="chat-box" class="h-44 overflow-y-auto bg-slate-950/80 p-3 rounded-lg border border-slate-800 space-y-2 text-sm mb-3">
        <p class="text-xs text-gray-500 italic">Welcome to Silver Peak Gaming Zone community chat!</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="username" type="text" placeholder="Username" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm sm:w-1/3 focus:outline-none focus:border-yellow-500 text-white">
        <input id="message" type="text" placeholder="Type a message..." class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm flex-1 focus:outline-none focus:border-yellow-500 text-white">
        <button onclick="sendMessage()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-5 py-2 rounded-lg text-sm font-bold transition">Send</button>
      </div>
    </section>

  </main>

  <!-- Floating Telegram Support Button -->
  <a href="https://t.me/your_telegram_username" target="_blank" rel="noopener noreferrer" class="fixed bottom-20 right-4 bg-sky-500 hover:bg-sky-400 text-white p-3.5 rounded-full shadow-2xl z-50 flex items-center justify-center transition duration-300 hover:scale-110 border-2 border-white/20">
    <i class="fa-brands fa-telegram text-2xl"></i>
  </a>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-2 text-xs text-slate-400 z-50">
    <a href="#" onclick="filterCategory('all')" class="text-yellow-400 flex flex-col items-center space-y-1">
      <i class="fa-solid fa-house text-base"></i><span>Home</span>
    </a>
    <a href="https://t.me/your_telegram_username" target="_blank" rel="noopener noreferrer" class="hover:text-sky-400 flex flex-col items-center space-y-1">
      <i class="fa-brands fa-telegram text-base text-sky-400"></i><span class="text-sky-400">Telegram</span>
    </a>
    <button onclick="openLiveChat()" class="hover:text-white flex flex-col items-center space-y-1">
      <i class="fa-solid fa-user text-base"></i><span>Account</span>
    </button>
  </nav>

  <!-- Swiper JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Application Logic -->
  <script>
    const swiper = new Swiper('.offerSwiper', {
      loop: true,
      autoplay: { delay: 3500, disableOnInteraction: false },
      pagination: { el: '.swiper-pagination', clickable: true },
    });

    // Games Array
    const gamesList = [
      { name: "Juwa 777", link: "https://dl.juwa777.com", image: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=400&q=80" },
      { name: "GameVault", link: "https://download.gamevault999.com", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80" },
      { name: "Orion Star", link: "https://orionstarsonline.com", image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=400&q=80" },
      { name: "Ultra Panda", link: "https://www.ultrapanda.mobi", image: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=400&q=80" },
      { name: "Panda Master", link: "https://pandamaster.vip:8888", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80" },
      { name: "VBlink", link: "https://www.vblink777.club", image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80" },
      { name: "Fire Kirin", link: "https://web.firekirin.xyz/firekirin/firekirin/", image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=400&q=80" },
      { name: "Las Vegas Sweeps", link: "https://m.lasvegassweeps.com", image: "https://images.unsplash.com/photo-1508801939243-2a11b0e35f08?auto=format&fit=crop&w=400&q=80" },
      { name: "Milkyway", link: "https://milkywayapp.xyz", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" }
    ];

    function fetchGames() {
      const grid = document.getElementById('gameGrid');
      if (grid) {
        grid.innerHTML = gamesList.map(game => `
          <a href="${game.link}" target="_blank" rel="noopener noreferrer" class="bg-slate-900/90 rounded-xl overflow-hidden border border-slate-800 hover:border-amber-500/60 transition duration-300 flex flex-col justify-between group shadow-xl hover:scale-[1.02]">
            <div class="h-28 overflow-hidden relative">
              <img src="${game.image}" alt="${game.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300" />
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
            </div>
            <div class="p-3 text-center bg-slate-900">
              <h3 class="font-bold text-xs text-white group-hover:text-yellow-400 transition">${game.name}</h3>
              <p class="text-[10px] text-slate-400 mb-2">Slot & Fish Arcade</p>
              <div class="w-full py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 text-xs font-black rounded-lg shadow-md hover:opacity-90 transition">
                Play Now
              </div>
            </div>
          </a>
        `).join('');
      }
    }

    function filterCategory(cat) { fetchGames(); }

    function openLiveChat() {
      if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
        window.Tawk_API.maximize();
      } else {
        alert("Live support is connecting...");
      }
    }

    document.addEventListener("DOMContentLoaded", fetchGames);
  </script>

  <!-- Live Chat Script -->
  <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/6a839b08cac7091d4454b22a/1k091b6uf';
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
    })();
  </script>

</body>
</html>
