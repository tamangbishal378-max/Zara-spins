<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Gaming Hub</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="pb-24">

  <!-- Header Section -->
  <header class="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🎰</span>
      <h1 class="text-xl font-bold bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
        Casino Hub
      </h1>
    </div>
    <div class="space-x-2">
      <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-lg border border-slate-700">
        Login
      </button>
      <button class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 text-sm font-bold rounded-lg hover:opacity-90">
        Register
      </button>
    </div>
  </header>

  <!-- Category Nav Tabs -->
  <div class="grid grid-cols-5 gap-2 p-3 bg-slate-900/80 border-b border-slate-800 text-center text-xs">
    <button class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center">
      <i class="fa-solid fa-fire text-orange-500 text-base mb-1"></i>Hot
    </button>
    <button class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center">
      <i class="fa-solid fa-bolt text-yellow-400 text-base mb-1"></i>Instant
    </button>
    <button class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center">
      <i class="fa-solid fa-gamepad text-blue-400 text-base mb-1"></i>Slots
    </button>
    <button class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center">
      <i class="fa-solid fa-dice text-red-500 text-base mb-1"></i>Casino
    </button>
    <button class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-700 flex flex-col items-center">
      <i class="fa-solid fa-spade text-purple-400 text-base mb-1"></i>Cards
    </button>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Web Game Frame Section -->
    <section class="rounded-xl overflow-hidden border border-slate-800 bg-slate-900 shadow-xl">
      <div class="px-4 py-2 bg-slate-800 text-xs font-semibold text-gray-400 border-b border-slate-700 flex justify-between items-center">
        <span>🎮 Live Web Game Frame</span>
        <span class="inline-block w-2 h-2 rounded-full bg-green-500"></span>
      </div>
      <div class="w-full h-[300px] sm:h-[400px]">
        <iframe 
          class="w-full h-full border-0" 
          src="https://6519639f8eed2f46d2016665--unrivaled-sorbet-6c774a.netlify.app/" 
          title="Gaming Platform">
        </iframe>
      </div>
    </section>

    <!-- Available Games Grid Section -->
    <section>
      <h2 class="text-lg font-bold border-l-4 border-yellow-500 pl-3 mb-4">
        🎮 Available Games
      </h2>
      <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <!-- JS renders games here -->
      </div>
    </section>

    <!-- Live Community Chat Section -->
    <section class="bg-slate-900 p-4 rounded-xl border border-slate-800">
      <h3 class="text-md font-bold mb-3 flex items-center gap-2 text-yellow-400">
        <i class="fa-solid fa-comments"></i> Live Chat
      </h3>
      
      <!-- Chat Box -->
      <div id="chat-box" class="h-48 overflow-y-auto bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2 text-sm mb-3">
        <p class="text-xs text-gray-500 italic">Welcome to community chat!</p>
      </div>

      <!-- Chat Inputs -->
      <div class="flex flex-col sm:flex-row gap-2">
        <input 
          id="username" 
          type="text" 
          placeholder="Username" 
          class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm sm:w-1/3 focus:outline-none focus:border-yellow-500 text-white"
        >
        <input 
          id="message" 
          type="text" 
          placeholder="Type a message..." 
          class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm flex-1 focus:outline-none focus:border-yellow-500 text-white"
        >
        <button 
          onclick="sendMessage()" 
          class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-5 py-2 rounded-lg text-sm font-bold transition">
          Send
        </button>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-2 text-xs text-slate-400 z-50">
    <a href="#" class="text-yellow-400 flex flex-col items-center space-y-1">
      <i class="fa-solid fa-house text-base"></i><span>Home</span>
    </a>
    <a href="#" class="hover:text-white flex flex-col items-center space-y-1">
      <i class="fa-solid fa-gift text-base"></i><span>Rewards</span>
    </a>
    <a href="#" class="hover:text-white flex flex-col items-center space-y-1">
      <i class="fa-solid fa-user-plus text-base"></i><span>Register</span>
    </a>
    <a href="#" class="hover:text-white flex flex-col items-center space-y-1">
      <i class="fa-solid fa-user text-base"></i><span>Account</span>
    </a>
  </nav>

  <!-- Application JavaScript -->
  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_KEY = "your-anon-key";
    const _supabase = (window.supabase && !SUPABASE_URL.includes("your-supabase-url")) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    // Game List Items
    const gamesList = [
      { name: "Juwa 777", icon: "🐉", category: "Slot", color: "from-amber-600 to-red-600" },
      { name: "Orion Star", icon: "🌌", category: "Fish Game", color: "from-blue-600 to-indigo-700" },
      { name: "Milkyway", icon: "⭐", category: "Arcade", color: "from-purple-600 to-pink-600" },
      { name: "GameVault", icon: "🎰", category: "Slot", color: "from-emerald-600 to-teal-700" },
      { name: "Fire Kirin", icon: "🔥", category: "Fish Game", color: "from-orange-600 to-red-700" },
      { name: "Panda Master", icon: "🐼", category: "Slot", color: "from-slate-700 to-slate-900" }
    ];

    function fetchGames() {
      const grid = document.getElementById('gameGrid');
      if (grid) {
        grid.innerHTML = gamesList.map(game => `
          <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-slate-600 transition flex flex-col justify-between group">
            <div class="h-24 bg-gradient-to-tr ${game.color} flex items-center justify-center text-3xl group-hover:scale-105 transition">
              ${game.icon}
            </div>
            <div class="p-3 text-center">
              <h3 class="font-bold text-xs text-white">${game.name}</h3>
              <p class="text-[10px] text-slate-400 mb-2">${game.category}</p>
              <button class="w-full py-1 bg-yellow-500 hover:bg-yellow-400 text-slate-950 text-xs font-bold rounded">
                Play Now
              </button>
            </div>
          </div>
        `).join('');
      }
    }

    async function sendMessage() {
      const usernameInput = document.getElementById('username');
      const messageInput = document.getElementById('message');
      const chatBox = document.getElementById('chat-box');

      const username = usernameInput.value.trim() || 'Guest';
      const message = messageInput.value.trim();

      if (!message) return;

      const newMsg = document.createElement('div');
      newMsg.className = "p-1.5 bg-slate-900 rounded text-xs border border-slate-800";
      newMsg.innerHTML = `<span class="font-bold text-yellow-400">${username}:</span> ${message}`;
      chatBox.appendChild(newMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      messageInput.value = '';

      if (_supabase) {
        await _supabase.from('chat_messages').insert([{ username, message }]);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchGames();

      if (_supabase) {
        _supabase
          .channel('public:chat_messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
            const msg = payload.new;
            const chatBox = document.getElementById('chat-box');
            if (chatBox) {
              const div = document.createElement('div');
              div.className = "p-1.5 bg-slate-900 rounded text-xs border border-slate-800";
              div.innerHTML = `<span class="font-bold text-yellow-400">${msg.username}:</span> ${msg.message}`;
              chatBox.appendChild(div);
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          })
          .subscribe();
      }
    });
  </script>

  <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

      s0.parentNode.insertBefore(s1,s0);
    })();
  </script>

</body>
</html>
