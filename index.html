  <h1>🎰 Casino Gaming Hub</h1>
sb_publishable_WByST39n79LLRmfCr7_ODw_M_PFxcST
  <!-- Game Links Section -->
  <div class="section">
    <h2>🎮 Available Games</h2>
    <div id="games-list">Loading games...</div>
  </div>

  <!-- Live Chat Section -->
  <div class="section">
    <h2>💬 Live Chat</h2>
    <div id="chat-box"></div>
    <input type="text" id="username" placeholder="Your Name" style="width: 25%; margin-right: 5px;">
    <input type="text" id="message" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // 1. Supabase Credentials (Updated with your API Key)
    const SUPABASE_URL = 'https://zezoqsvodqoqdmkkpwt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nW5ZNjrzxyE4HPvyRD_UA_xkAhJich';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Fetch Game Links
    async function fetchGames() {
      const { data, error } = await _supabase.from('game_links').select('*').eq('is_active', true);
      const container = document.getElementById('games-list');
      if (error || !data || !data.length) {
        container.innerHTML = '<p>No games available right now.</p>';
        return;
      }
      container.innerHTML = data.map(g => `
        <div class="game-card">
          <span><strong>${g.title}</strong> (${g.category})</span>
          <a class="game-btn" href="${g.game_url}" target="_blank">Play Now</a>
        </div>
      `).join('');
    }

    // 3. Live Chat Functionality
    async function sendMessage() {
      const username = document.getElementById('username').value || 'Guest';
      const message = document.getElementById('message').value;
      if (!message) return;

      await _supabase.from('chat_messages').insert([{ username, message }]);
      document.getElementById('message').value = '';
    }

    // Realtime Messages Subscriptions
    _supabase
      .channel('public:chat_messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
        const msg = payload.new;
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div class="chat-msg"><strong>${msg.username}:</strong> ${msg.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      })
      .subscribe();

    // Initial Load
    fetchGames();
  </script>
